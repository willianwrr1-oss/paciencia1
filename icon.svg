<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fundo Feltro Verde -->
  <rect width="512" height="512" fill="#008080" rx="96"/>
  
  <!-- Corpo da Carta -->
  <rect x="96" y="48" width="320" height="416" rx="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="4"/>
  
  <!-- Verso da Carta Azul XP -->
  <rect x="112" y="64" width="288" height="384" rx="16" fill="#000080" stroke="#5a82d6" stroke-width="4"/>
  
  <!-- Símbolo do Espadas e XP -->
  <text x="256" y="240" font-family="Tahoma, Arial, sans-serif" font-size="140" font-weight="bold" fill="#ffffff" text-anchor="middle">♠</text>
  <text x="256" y="350" font-family="Tahoma, Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle">XP</text>
</svg>
