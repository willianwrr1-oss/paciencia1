<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Ícone Paciência XP</title>
</head>
<body>
  <canvas id="iconCanvas" width="512" height="512" style="display:none;"></canvas>
  <script>
    const canvas = document.getElementById("iconCanvas");
    const ctx = canvas.getContext("2d");

    // Fundo Verde Feltro/XP
    ctx.fillStyle = "#008080";
    ctx.fillRect(0, 0, 512, 512);

    // Borda da Carta (Arredondada)
    const x = 96, y = 48, w = 320, h = 416, r = 24;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#1a1a1a";
    ctx.lineWidth = 4;
    ctx.stroke();

    // Verso Azul Clássico do XP
    const ix = 112, iy = 64, iw = 288, ih = 384, ir = 16;
    ctx.fillStyle = "#000080";
    ctx.beginPath();
    ctx.moveTo(ix + ir, iy);
    ctx.arcTo(ix + iw, iy, ix + iw, iy + ih, ir);
    ctx.arcTo(ix + iw, iy + ih, ix, iy + ih, ir);
    ctx.arcTo(ix, iy + ih, ix, iy, ir);
    ctx.arcTo(ix, iy, ix + iw, iy, ir);
    ctx.closePath();
    ctx.fill();

    // Padronagem Interna
    ctx.strokeStyle = "#5a82d6";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Desenhar A do Ás no Centro
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 140px 'Segoe UI', Tahoma, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("♠", 256, 230);
    ctx.font = "bold 90px 'Segoe UI', Tahoma, sans-serif";
    ctx.fillText("XP", 256, 340);

    // Baixar imagem como icon.png
    setTimeout(() => {
      const link = document.createElement('a');
      link.download = 'icon.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }, 300);
  </script>
</body>
</html>
